name: Publish PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest build twine

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Ensure PyPI token is configured
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || secrets.DEEPSAFETYPYPI }}" ]; then
            echo "Missing PyPI token secret. Set PYPI_API_TOKEN, PYPI_TOKEN, or DEEPSAFETYPYPI."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN || secrets.DEEPSAFETYPYPI }}
          skip-existing: true
