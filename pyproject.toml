[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsafety"
version = "0.1.0"
description = "A Python library for industrial and safety calculations"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]
authors = [
    { name="Pkbythebay29", email="kannan@haztechrisk.org" }
]
license = { file="LICENSE" }
readme = "README.md"
keywords = ["process safety", "dispersion", "flammability", "explosions", "toxicology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pkbythebay29/deepsafety"

[project.scripts]
deepsafety-api = "deepsafety.api:main"
deepsafety-mcp = "deepsafety.mcp_server:main"

[tool.setuptools.packages.find]
where = ["deepsafety"]
