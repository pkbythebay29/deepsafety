[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsafety"
version = "1.0.2"
description = "OpenAPI-aligned process safety analysis package with materials, source, dispersion, fire, relief, and hazard-evaluation services"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]
requires-python = ">=3.10"
authors = [
    { name="Pkbythebay29", email="kannan@haztechrisk.org" }
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["process safety", "dispersion", "flammability", "explosions", "toxicology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
]

[project.urls]
Homepage = "https://github.com/pkbythebay29/deepsafety"
Documentation = "https://pkbythebay29.github.io/deepsafety/api-docs.html"
Repository = "https://github.com/pkbythebay29/deepsafety"
Changelog = "https://github.com/pkbythebay29/deepsafety/blob/main/RELEASE_NOTES.md"

[project.scripts]
deepsafety-api = "deepsafety.api:main"
deepsafety-mcp = "deepsafety.mcp_server:main"

[project.optional-dependencies]
jupyter = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepsafety*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"deepsafety" = ["data/*.json"]
